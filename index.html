<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Houses | Live TV & Radio</title>
    <meta name="description" content="Premium access to Rwanda's top media houses. Watch TV and listen to radio live.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">
                <i class="fa-solid fa-play-circle"></i> KagirInkuru
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Live Channels</h1>
            <p>Stream your favorite Rwandan TV and Radio stations in real-time.</p>
        </header>

        <section>
            <h2>TV Stations</h2>
            <div class="media-grid">
                <!-- RTV -->
                <div class="channel-card">
                    <h3>Rwanda TV</h3>
                    <div class="video-wrapper">
                        <video id="rtv-video" width="400" controls preload="none"></video>
                        <div class="play-overlay" id="rtv-overlay">
                            <span class="play-button"></span>
                        </div>
                    </div>
                </div>

                <!-- KC2 -->
                <div class="channel-card">
                    <h3>KC2</h3>
                    <div class="video-wrapper">
                        <video id="kc2-video" width="400" controls preload="none"></video>
                        <div class="play-overlay" id="kc2-overlay">
                            <span class="play-button"></span>
                        </div>
                    </div>
                </div>

                <!-- TV Garden -->
                <div class="channel-card">
                    <h3>TV Garden</h3>
                    <iframe id="tv-garden-iframe" title="TV Garden Player" src="https://tv.garden/rw" width="100%" height="225"
                        style="border: 0;" sandbox="allow-scripts allow-same-origin" allowfullscreen loading="lazy"></iframe>
                </div>
            </div>
        </section>

        <section>
            <h2>Radio Stations</h2>
            <div class="media-grid">
                <!-- B&B FM -->
                <div class="audio-container">
                    <h3>B&B FM</h3>
                    <iframe id="bb-fm-iframe" title="B&B FM TuneIn Player" src="https://tunein.com/embed/player/s281307/"
                        style="width:100%; height:100px; border: 0; overflow: hidden;" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
                </div>
            </div>
        </section>

        <section>
            <h3>RBA Radio Stations</h3>
            <div class="media-grid">
                <div class="audio-container">
                    <h3>Radio Rwanda</h3>
                    <div class="audio-wrapper">
                        <audio id="radio-rwanda" controls preload="none" type="audio/mpeg"></audio>
                        <div class="play-overlay" id="radio-rwanda-overlay">
                            <span class="play-button"></span>
                        </div>
                    </div>
                </div>
                <div class="audio-container">
                    <h3>Magic FM</h3>
                    <div class="audio-wrapper">
                        <audio id="magic-fm" controls preload="none" type="audio/mpeg"></audio>
                        <div class="play-overlay" id="magic-fm-overlay">
                            <span class="play-button"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 KagirInkuru. bringing you the best of Rwandan media.</p>
            <div class="footer-links">
                <a href="https://x.com/HonoreIRAD"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://www.linkedin.com/in/honore-iradukunda"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="https://github.com/honoreade"><i class="fa-brands fa-github"></i></a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16" defer></script>
    <script src="script.js" defer></script>
</body>

</html>
